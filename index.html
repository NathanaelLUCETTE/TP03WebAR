<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>TP 03 - A-Frame - Exercice 2</title>


    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <!-- Physics -->
    <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@4.2.0/dist/aframe-physics-system.min.js"></script>


    <!-- Super Hands -->
    <script src="https://unpkg.com/super-hands@3.0.5/dist/super-hands.js"></script>


    <!-- ========================= -->
    <!-- DÉPLACEMENT VR             -->
    <!-- ========================= -->

    <script>

    AFRAME.registerComponent('vr-movement', {

        schema: {

            speed: {
                type: 'number',
                default: 3
            },

            rotationSpeed: {
                type: 'number',
                default: 60
            }

        },


        tick: function (time, delta) {

            const player =
                document.querySelector('#player');

            const leftHand =
                document.querySelector('#leftHand');

            const rightHand =
                document.querySelector('#rightHand');


            // =========================
            // JOYSTICK GAUCHE
            // =========================

            const leftGamepad =
                leftHand
                .components['tracked-controls']
                ?.controller
                ?.gamepad;


            if (leftGamepad) {

                // AXES INVERSÉS
                let y =
                    leftGamepad.axes[2] || 0;

                let x =
                    leftGamepad.axes[3] || 0;


                // Deadzone
                if (Math.abs(x) < 0.15)
                    x = 0;

                if (Math.abs(y) < 0.15)
                    y = 0;


                // Avant / arrière
                player.object3D.translateZ(
                    y *
                    this.data.speed *
                    delta / 1000
                );


                // Gauche / droite
                player.object3D.translateX(
                    x *
                    this.data.speed *
                    delta / 1000
                );

            }


            // =========================
            // JOYSTICK DROIT
            // =========================

            const rightGamepad =
                rightHand
                .components['tracked-controls']
                ?.controller
                ?.gamepad;


            if (rightGamepad) {

                let x =
                    rightGamepad.axes[2] || 0;


                if (Math.abs(x) < 0.15)
                    x = 0;


                // Rotation
                player.object3D.rotation.y -=

                    x *
                    this.data.rotationSpeed *
                    delta / 1000 *
                    Math.PI / 180;

            }

        }

    });

    </script>

</head>


<body>

<a-scene
    shadow="type: pcfsoft"
    physics="debug: true">


    <!-- ========================= -->
    <!-- LUMIÈRES                  -->
    <!-- ========================= -->

    <a-entity
        light="type: ambient; intensity: 0.5">
    </a-entity>


    <a-entity
        light="type: directional;
               intensity: 1;
               castShadow: true"
        position="2 4 2">
    </a-entity>


    <!-- ========================= -->
    <!-- JOUEUR                    -->
    <!-- ========================= -->

    <a-entity
        id="player"
        vr-movement>


        <!-- Caméra -->

        <a-camera
            position="0 1.6 0">
        </a-camera>


        <!-- Main gauche -->

        <a-entity
            id="leftHand"
            hand-controls="hand: left"
            sphere-collider="objects: .grabbable"
            super-hands>
        </a-entity>


        <!-- Main droite -->

        <a-entity
            id="rightHand"
            hand-controls="hand: right"
            sphere-collider="objects: .grabbable"
            super-hands>
        </a-entity>


    </a-entity>


    <!-- ========================= -->
    <!-- OBJETS PHYSIQUES          -->
    <!-- ========================= -->


    <!-- Cube -->

    <a-box
        id="cube"
        class="grabbable"
        position="0 1 -3"
        color="red"
        shadow="cast: true; receive: true"
        dynamic-body
        grabbable>
    </a-box>


    <!-- Sphère -->

    <a-sphere
        id="sphere"
        class="grabbable"
        position="2 2 -3"
        radius="1"
        color="blue"
        shadow="cast: true; receive: true"
        dynamic-body
        grabbable>
    </a-sphere>


    <!-- ========================= -->
    <!-- SOL                       -->
    <!-- ========================= -->

    <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="20"
        height="20"
        color="green"
        shadow="receive: true"
        static-body>
    </a-plane>


</a-scene>

</body>

</html>
