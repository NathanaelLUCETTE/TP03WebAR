<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>TP 03 - WebVR avec A-Frame</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <script>

    AFRAME.registerComponent('vr-movement', {

        schema: {

            speed: {
                type: 'number',
                default: 3
            },

            rotationSpeed: {
                type: 'number',
                default: 60
            }

        },


        tick: function (time, delta) {

            const player =
                document.querySelector('#player');

            const leftHand =
                document.querySelector('#leftHand');

            const rightHand =
                document.querySelector('#rightHand');


            // =========================
            // CONTRÔLEUR GAUCHE
            // =========================

            const leftGamepad =
                leftHand
                .components['tracked-controls']
                ?.controller
                ?.gamepad;


            if (leftGamepad) {

                let x =
                    leftGamepad.axes[2] || 0;

                let y =
                    leftGamepad.axes[3] || 0;


                // Deadzone
                if (Math.abs(x) < 0.15)
                    x = 0;

                if (Math.abs(y) < 0.15)
                    y = 0;


                // Avant / arrière
                player.object3D.translateZ(
                    y *
                    this.data.speed *
                    delta / 1000
                );


                // Gauche / droite
                player.object3D.translateX(
                    x *
                    this.data.speed *
                    delta / 1000
                );
            }


            // =========================
            // CONTRÔLEUR DROIT
            // =========================

            const rightGamepad =
                rightHand
                .components['tracked-controls']
                ?.controller
                ?.gamepad;


            if (rightGamepad) {

                let x =
                    rightGamepad.axes[2] || 0;


                if (Math.abs(x) < 0.15)
                    x = 0;


                player.object3D.rotation.y -=

                    x *
                    this.data.rotationSpeed *
                    delta / 1000 *
                    Math.PI / 180;
            }

        }

    });

    </script>

</head>


<body>

<a-scene shadow="type: pcfsoft">


    <!-- ========================= -->
    <!-- LUMIÈRES                  -->
    <!-- ========================= -->

    <a-entity
        light="type: ambient; intensity: 0.5">
    </a-entity>


    <a-entity
        light="type: directional;
               intensity: 1;
               castShadow: true"
        position="2 4 2">
    </a-entity>


    <!-- ========================= -->
    <!-- JOUEUR                    -->
    <!-- ========================= -->

    <a-entity
        id="player"
        vr-movement>


        <!-- Caméra -->
        <a-camera
            position="0 1.6 0">
        </a-camera>


        <!-- Contrôleur gauche -->
        <a-entity
            id="leftHand"
            hand-controls="hand: left">
        </a-entity>


        <!-- Contrôleur droit -->
        <a-entity
            id="rightHand"
            hand-controls="hand: right">
        </a-entity>

    </a-entity>


    <!-- ========================= -->
    <!-- OBJETS                    -->
    <!-- ========================= -->

    <!-- Cube -->
    <a-box
        position="0 1 -3"
        color="red"
        shadow="cast: true; receive: true">
    </a-box>


    <!-- Sphère -->
    <a-sphere
        position="2 1 -3"
        radius="1"
        color="blue"
        shadow="cast: true; receive: true">
    </a-sphere>


    <!-- Sol -->
    <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="20"
        height="20"
        color="green"
        shadow="receive: true">
    </a-plane>


</a-scene>

</body>

</html>
